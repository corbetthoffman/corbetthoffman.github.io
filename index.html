<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corbett Hoffman | Actor · Model</title> <!-- CHANGE if needed -->
  <meta name="description" content="Corbett Hoffman, actor and model. Headshots, contact, and Actors Access profile.">
  <meta property="og:title" content="Corbett Hoffman | Actor · Model">
  <meta property="og:image" content="hero.jpg">
  <style>
    :root {
      --bg: #0e0e0e;
      --text: #f2efe9;
      --muted: #a8a39a;
      --accent: #d8c3a5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    /* HERO */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      background: url("hero.jpg") center top / cover no-repeat;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(14,14,14,0.95) 0%, rgba(14,14,14,0.2) 55%, rgba(14,14,14,0) 100%);
    }
    .hero-text {
      position: relative;
      z-index: 1;
      padding: 0 6vw 8vh;
      max-width: 900px;
    }
    h1 {
      font-size: clamp(2.8rem, 9vw, 6rem);
      font-weight: normal;
      letter-spacing: 0.04em;
      line-height: 1.05;
    }
    .tagline {
      margin-top: 0.8rem;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: Helvetica, Arial, sans-serif;
    }

    /* SECTIONS */
    section { padding: 80px 6vw; max-width: 1100px; margin: 0 auto; }
    h2 {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: Helvetica, Arial, sans-serif;
      font-weight: normal;
      margin-bottom: 1.5rem;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.5rem;
      font-family: Helvetica, Arial, sans-serif;
    }
    .stats div span {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stats div strong { font-weight: normal; font-size: 1.15rem; }

    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      height: 520px;
      object-fit: cover;
      display: block;
    }

    /* LINKS */
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border: 1px solid var(--accent);
      color: var(--text);
      text-decoration: none;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover { background: var(--accent); color: var(--bg); }

    footer {
      text-align: center;
      padding: 40px 6vw 60px;
      color: var(--muted);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
    }
    @media (max-width: 600px) {
      .gallery img { height: 420px; }
      section { padding: 56px 6vw; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-text">
      <h1>Corbett Hoffman</h1> <!-- CHANGE -->
      <p class="tagline">Actor &nbsp;|&nbsp; Model</p>
    </div>
  </header>

  <section>
    <h2>Details</h2>
    <div class="stats">
      <!-- CHANGE or delete any of these -->
      <div><span>Height</span><strong>5'8"</strong></div>
      <div><span>Hair</span><strong>Brown</strong></div>
      <div><span>Eyes</span><strong>Brown</strong></div>
      <div><span>Based in</span><strong>New York, NY</strong></div>
    </div>
  </section>

  <section>
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="photo2.jpg" alt="Corbett Hoffman headshot">
      <img src="photo3.jpg" alt="Corbett Hoffman portrait">
    </div>
  </section>

  <section>
    <h2>Connect</h2>
    <div class="links">
      <!-- CHANGE all three links -->
      <a class="btn" href="https://resumes.actorsaccess.com/corbett" target="_blank" rel="noopener">Actors Access</a>
      <a class="btn" href="https://instagram.com/turbocorbett" target="_blank" rel="noopener">Instagram</a>
      <a class="btn" href="mailto:parissoon@icloud.com">Email</a>
    </div>
  </section>

  <footer>© 2026 CORBETT HOFFMAN</footer>

</body>
</html>
